# Publishes the static build to GitHub Pages (PLAN.md 4.7: the app is static
# files, so hosting it costs nothing and runs no server of ours).
#
# BASE_PATH is the load-bearing setting. A Pages *project* site serves under
# /<repo>/, and SvelteKit has to build with that prefix or every asset 404s.
# Point a custom domain here later and it becomes an empty string, with no
# change to this file or the code: Pages reports where it serves the site from
# and the build is told that. See svelte.config.js.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  # Both are required by actions/deploy-pages: `pages` to publish, `id-token` to
  # prove the artifact came from this workflow.
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site is
# worse than a slightly stale one. Queued runs collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # For its outputs: where Pages serves this site from, as a scheme and
      # host (`origin`) and a path prefix (`base_path`). Both follow a custom
      # domain if one is ever configured, and they have to be taken together:
      # the og:image URL is one appended to the other.
      - id: pages
        uses: actions/configure-pages@v5

      # An empty origin builds a site that works and whose every invite has no
      # image on its card, with nothing red anywhere to say so.
      - name: Require the Pages origin
        if: steps.pages.outputs.origin == ''
        run: |
          echo "::error::configure-pages reported no origin, so og:image would not be an absolute URL"
          exit 1

      - name: Build
        env:
          # The URL prefix Pages serves this site under: /<repo> for a project
          # site, empty on a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Link-preview crawlers only accept an absolute og:image, and a static
          # build cannot know where it will be served from (src/app.html).
          PUBLIC_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: bun run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
