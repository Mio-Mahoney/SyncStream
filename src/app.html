<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Link previews. These live in the shell rather than in a <svelte:head>
			because nothing prerenders: the crawlers that build a preview card for a
			pasted link read this file as served and never run the script that would
			have added them.

			One set for every URL, since every URL is this one file. That is why
			there is no og:url -- it would name the landing page on an invite -- and
			why the copy reads correctly both for someone deciding whether to try
			the app and for someone who was just sent a room.

			The %app.*% placeholders are filled in by src/hooks.server.ts as the
			shell is built. The description is the landing page's own sentence and
			the one drawn on the card image, kept in one place (src/lib/copy.ts) so
			the three cannot drift apart.

			og:image has to be absolute, and a static build cannot know its own
			origin, so the deploy supplies it (PUBLIC_ORIGIN, see deploy.yml).
			Without it the address is root-relative: fine locally, where no crawler
			is looking, and the build says so.
		-->
		<meta name="description" content="%app.description%" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="SyncStream" />
		<meta property="og:title" content="SyncStream - watch a video together, in sync" />
		<meta property="og:description" content="%app.description%" />
		<meta property="og:image" content="%app.origin%%sveltekit.assets%/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="SyncStream: %app.description%" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
